name: Quality checks

# Workflow-file lint and secrets scan, through the reusable workflow of dadamagouil/devops.
# Runner: repository variable RUNNER_LABELS (JSON list); GitHub runners when it is absent.
on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: dadamagouil/devops/.github/workflows/quality.yml@v1.0.2
    with:
      devops-ref: v1.0.2
      runner-labels: ${{ vars.RUNNER_LABELS || '["ubuntu-latest"]' }}
